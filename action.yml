name: Run Rafn
description: Install the rafn CLI via taiki-e/install-action and run it.

inputs:
  version:
    description: Crate version to install, such as 0.1.0. Use latest for the newest release.
    required: false
    default: latest
  command:
    description: Rafn subcommand to invoke, such as bench, push, trend, compare, bisect, or config.
    required: false
    default: bench
  args:
    description: Additional arguments passed to the rafn subcommand.
    required: false
    default: ''
  working-directory:
    description: Directory to run the rafn command in, such as a benchmark project within a monorepo.
    required: false
    default: ''
  api-key:
    description: >-
      rafn API key, passed to the command as RAFN_API_KEY. Required by push,
      trend, and compare when the backend is cloud. Pass it from a repository or
      organization secret, never as a literal.
    required: false
    default: ''

outputs:
  path:
    description: Path to the installed rafn executable.
    value: ${{ steps.resolve.outputs.path }}

runs:
  using: composite
  steps:
    - name: Install rafn
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: rafn${{ inputs.version != 'latest' && format('@{0}', inputs.version) || '' }}

    - name: Resolve rafn path
      id: resolve
      shell: bash
      run: echo "path=$(command -v rafn)" >> "${GITHUB_OUTPUT}"

    - name: Run rafn
      shell: bash
      working-directory: ${{ inputs.working-directory || github.workspace }}
      env:
        RAFN_PATH: ${{ steps.resolve.outputs.path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        # Exported only when provided: setting RAFN_API_KEY in the step's env
        # unconditionally would overwrite a key the workflow already set at job
        # level with this input's empty default.
        if [[ -n "${INPUT_API_KEY}" ]]; then
          export RAFN_API_KEY="${INPUT_API_KEY}"
        fi
        set -f
        # shellcheck disable=SC2206
        args=(${INPUT_ARGS})
        set +f
        "${RAFN_PATH}" "${INPUT_COMMAND}" "${args[@]}"
