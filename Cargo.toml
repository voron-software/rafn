[package]
name = "rafn"
version = "0.1.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "A lightweight benchmark uploader"
homepage = "https://rafn.dev"
repository = "https://github.com/voron-software/rafn"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rafn-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/rafn-{ target }.zip"
pkg-fmt = "zip"

[lib]
name = "rafn"
path = "src/lib.rs"

[[bin]]
name = "rafn"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.49", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"

# Configuration loading (file + env layering)
config = { version = "0.15", default-features = false, features = ["toml"] }

# gRPC
#
# The cloud API is served over https, so the client needs TLS:
# - `tls-ring` selects rustls' ring crypto provider. ring builds with just a C
#   compiler, whereas aws-lc-rs can need cmake or NASM depending on the target,
#   which would complicate the cross-compiled release targets (aarch64 Linux,
#   Windows MSVC; see release.yml).
# - `tls-native-roots` trusts the OS certificate store instead of a bundled
#   Mozilla list, so corporate TLS-inspecting proxies whose CA is installed on
#   developer machines and CI runners keep working (see store/remote/channel.rs).
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
prost = { version = "0.14" }
tonic-prost = "0.14"
prost-types = "0.14"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
tabled = { version = "0.22", features = ["ansi"] }
colored = "3.1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data types
uuid = { version = "1.20", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# URL parsing (git remote URLs)
url = "2"

# Plain HTTPS GET for the GitHub Actions OIDC token (src/config/actions_token.rs).
#
# - `rustls-no-provider` keeps reqwest on rustls but without its built-in
#   aws-lc-rs provider, which docs/architecture/transport-security.md rules out
#   for the cross-compiled release targets. reqwest then needs a provider
#   installed process-wide; the `rustls` dependency below, with the `ring`
#   provider tonic already uses, is how actions_token.rs installs one.
# - Roots come from the OS trust store through rustls-platform-verifier, as for
#   the gRPC channel.
# - No `http2`, `system-proxy`, compression or cookies: one HTTP/1.1 GET.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "core_benchmarks"
harness = false

[[bench]]
name = "parser_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
